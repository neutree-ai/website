<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<!--
  Source for og-image.png. Not served — it is rendered to a PNG and the PNG is
  what ships. To regenerate after a copy or palette change:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless=new --disable-gpu --hide-scrollbars \
      --window-size=1200,630 \
      --screenshot=public/images/nap-og-image.png \
      "file://$PWD/og/nap-og-image.html"

  Deliberately not an AI-generated illustration: the card is built from the
  landing page's own parts — the wordmark, the slogan lockup, and the night
  band reduced to its one hard edge.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #0C2849;
    --ink-3: rgba(12, 40, 73, 0.56);
    --ink-4: rgba(12, 40, 73, 0.40);
    --ground: #FFFFFF;
    --rule: rgba(12, 40, 73, 0.11);
    --rule-strong: rgba(12, 40, 73, 0.30);
    --live: #0B7A57;
    --live-wash: rgba(11, 122, 87, 0.09);
    --sans: 'DM Sans', sans-serif;
    --mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    width: 1200px;
    height: 630px;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 1200px;
    height: 630px;
    padding: 68px 72px 60px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .top { display: flex; align-items: flex-start; justify-content: space-between; }

  .eyebrow {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-3);
  }

  .glyph { width: 34px; height: 34px; }

  .brand {
    margin: 40px 0 0;
    font-size: 116px;
    font-weight: 600;
    line-height: 1;
    letter-spacing: -0.03em;
  }

  .slogan {
    margin: 22px 0 0;
    font-size: 46px;
    font-weight: 400;
    line-height: 1.16;
    letter-spacing: -0.03em;
  }
  .slogan em { font-style: normal; color: var(--ink-3); }

  /* the page's own signature, reduced to its one hard edge */
  .band { margin-top: 46px; }

  .axis { position: relative; height: 34px; }
  .axis::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    top: 50%;
    height: 1px;
    background: var(--rule-strong);
  }
  .closed {
    position: absolute;
    left: 0;
    right: 12.5%;
    top: 0;
    bottom: 0;
    background: var(--live-wash);
    border-right: 1.5px solid var(--live);
  }
  .dot {
    position: absolute;
    left: var(--x);
    top: 50%;
    width: 9px;
    height: 9px;
    margin: -4.5px 0 0 -4.5px;
    border-radius: 50%;
    background: var(--ink);
  }
  .dot.human { background: var(--live); }

  .labels {
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-family: var(--mono);
    font-size: 14px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-4);
  }
  .labels .human { color: var(--live); }

  .foot {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    font-family: var(--mono);
    font-size: 16px;
    color: var(--ink-3);
  }
  .foot .url { color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div>
      <div class="top">
        <span class="eyebrow">Neutree Agent Platform</span>
        <svg class="glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="1.5" y="1.5" width="21" height="21" stroke="#0C2849" stroke-width="1.4"/>
          <path d="M6.5 17V7l11 10V7" stroke="#0C2849" stroke-width="1.8" stroke-linecap="square"/>
        </svg>
      </div>

      <h1 class="brand">NAP</h1>
      <p class="slogan"><em>Close your laptop.</em><br />Your agents keep working.</p>
    </div>

    <div>
      <div class="band">
        <div class="axis">
          <div class="closed"></div>
          <i class="dot" style="--x: 8.5%"></i>
          <i class="dot" style="--x: 29.2%"></i>
          <i class="dot" style="--x: 50%"></i>
          <i class="dot human" style="--x: 87.5%"></i>
        </div>
        <div class="labels">
          <span>23:00 &nbsp;·&nbsp; laptop closed</span>
          <span class="human">06:30 &nbsp;·&nbsp; you open it</span>
        </div>
      </div>

      <div class="foot">
        <span>Build, distribute, and optimize AI agents, on infrastructure you own.</span>
        <span class="url">neutree.ai/nap</span>
      </div>
    </div>
  </div>
</body>
</html>
